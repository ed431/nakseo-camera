<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>캐릭터 가면 카메라 🐼</title>
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
<div id="stage">
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="art"></canvas>

  <!-- 상단 캐릭터 선택 -->
  <div id="topbar">
    <div class="logo">🐼 가면카메라 <small>v8</small></div>
    <div id="chars">
      <button data-char="panda" class="char-btn active">🐼</button>
      <button data-char="rabbit" class="char-btn">🐰</button>
      <button data-char="cat" class="char-btn">🐱</button>
      <button data-char="bear" class="char-btn">🐻</button>
      <button data-char="frog" class="char-btn">🐸</button>
      <button data-char="random" class="char-btn">🎲</button>
    </div>
  </div>

  <div id="status">📷 준비 중…</div>

  <!-- 배율 -->
  <div id="zoombar"></div>

  <!-- 하단 버튼 -->
  <div id="bottombar">
    <button id="btnShuffle" class="doodle-btn small" title="가면 바꾸기">🎲</button>
    <button id="btnShot" class="doodle-btn big" title="사진 찍기">📸</button>
    <button id="btnFlip" class="doodle-btn small" title="전면/후면 전환">🔄</button>
  </div>
  <div id="hint">얼굴을 화면 가운데에 맞춰주세요 ✨</div>
</div>

<!-- 로딩 -->
<div id="loading" class="overlay">
  <div class="hand-card">
    <div class="hand-title">🐼 가면 준비 중…</div>
    <p>얼굴 인식 모델을 받고 있어요!<br>잠시만 기다려 주세요.</p>
  </div>
</div>

<!-- 권한 거부 안내 -->
<div id="denied" class="overlay hidden">
  <div class="hand-card">
    <div class="hand-title">📷 카메라를 허용해 주세요!</div>
    <p>이 앱은 카메라가 꼭 필요해요.</p>
    <ol>
      <li>삼성 인터넷/크롬: 주소창 자물쇠 → 카메라 허용</li>
      <li>그리고 아래 버튼을 눌러 다시 시작!</li>
    </ol>
    <button id="btnRetry" class="doodle-btn">다시 시작 🌱</button>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script type="importmap">
{ "imports": { "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm" } }
</script>
<script type="module" src="app.js?v=9"></script>
</body>
</html>
