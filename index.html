<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>낙서 카메라 📸</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="art"></canvas>

  <!-- 상단 스타일 선택 -->
  <div id="topbar">
    <div class="logo">🖍️ 낙서카메라</div>
    <div id="styles" role="tablist">
      <button data-style="crayon" class="style-btn active">크레용</button>
      <button data-style="marker" class="style-btn">매직펜</button>
      <button data-style="high" class="style-btn">형광펜</button>
    </div>
  </div>

  <div id="status">📷 준비 중…</div>

  <!-- 하단 버튼 -->
  <div id="bottombar">
    <button id="btnShuffle" class="doodle-btn small" title="낙서 다시 섞기">🎲</button>
    <button id="btnShot" class="doodle-btn big" title="사진 찍기">📸</button>
    <button id="btnFlip" class="doodle-btn small" title="전면/후면 전환">🔄</button>
  </div>
  <div id="hint">얼굴을 비춰보세요! 컵·식물도 캐릭터가 돼요 ✨</div>
</div>

<!-- 로딩 -->
<div id="loading" class="overlay">
  <div class="hand-card">
    <div class="hand-title">🖍️ 낙서 준비 중…</div>
    <p>크레용을 깎고 있어요!<br>잠시만 기다려 주세요.</p>
  </div>
</div>

<!-- 권한 거부 안내 -->
<div id="denied" class="overlay hidden">
  <div class="hand-card">
    <div class="hand-title">📷 카메라를 허용해 주세요!</div>
    <p>이 앱은 카메라가 꼭 필요해요.</p>
    <ol>
      <li>아이폰: 설정 → Safari → 카메라 → 허용</li>
      <li>안드로이드: 주소창 자물쇠 → 카메라 허용</li>
      <li>그리고 아래 버튼을 눌러 다시 시작!</li>
    </ol>
    <button id="btnRetry" class="doodle-btn">다시 시작 🌱</button>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script type="importmap">
{ "imports": { "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm" } }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
